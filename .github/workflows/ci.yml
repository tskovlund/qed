name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1
        with:
          build: true
          test: true
          lean4checker: false

      - name: No sorry in proofs
        run: |
          if [ -d "Qed/Proofs" ]; then
            if grep -rn 'sorry' Qed/Proofs/; then
              echo "ERROR: sorry found in proof files"
              exit 1
            fi
          fi
          echo "No sorry found"

      - name: Build docgen
        run: lake build docgen

      - name: Docs freshness
        run: |
          .lake/build/bin/docgen schema > /tmp/spec.schema.json
          .lake/build/bin/docgen markdown > /tmp/spec-format.md
          diff docs/spec.schema.json /tmp/spec.schema.json || {
            echo "ERROR: docs/spec.schema.json is stale — run 'devbox run docs' and commit"
            exit 1
          }
          diff docs/spec-format.md /tmp/spec-format.md || {
            echo "ERROR: docs/spec-format.md is stale — run 'devbox run docs' and commit"
            exit 1
          }
