name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1
        with:
          build: true
          test: true
          lean4checker: true

      - name: No sorry in proofs
        run: |
          if [ -d "Qed/Proofs" ]; then
            if grep -rn 'sorry' Qed/Proofs/; then
              echo "ERROR: sorry found in proof files"
              exit 1
            fi
          fi
          echo "No sorry found"
