#:schema ../docs/spec.schema.json

name = "cli-correctness"

# --- Proof criteria ---

[[criteria]]
description = "Pass/fail decision is correct: allPassed returns true iff no result is .fail"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.OutputCorrectness.allPassed_iff_no_failures"

# --- Agent review ---

[[criteria]]
description = "CLI argument parsing, dispatch, and error handling are correct"

[criteria.verify]
type = "agent"
prompt = """
Review Main.lean and Qed/Output.lean. Verify:

1. Every subcommand (run, verify, parse, version, help) is handled
2. Unknown commands produce a clear error on stderr with exit code 1
3. The --json flag is position-independent and works with all subcommands
4. Error output respects --json mode (JSON to stdout vs plain text to stderr)
5. `qed run` dispatches correctly: verify-mode specs run single-pass
   verification, worker-loop specs run the worker loop via WorkerLoop.run
6. No command loads the spec file more than once
7. Help text documents all available commands and options
8. JSON output has consistent structure (spec, passed, criteria fields)
9. Every VerificationResult constructor is handled in Output serialization

Report any unreachable code paths, missing error handling, or UX issues.
"""

[[criteria]]
description = "Verifier handles all verification types and shell execution safely"

[criteria.verify]
type = "agent"
prompt = """
Review Qed/Verifier.lean. Verify:

1. Every VerifyType constructor is handled in verifyCriterion (exhaustive match)
2. Shell execution uses platform detection (Unix vs Windows)
3. Output truncation preserves the LAST 2000 chars (most recent output is
   most useful for debugging)
4. Exit code 0 maps to pass, non-zero maps to fail — no edge cases missed
5. Unimplemented verification types return .skipped, not .fail or .pass
6. Human verification returns .needsHuman, not .skipped

Report any safety concerns, missing edge cases, or incorrect result mappings.
"""
