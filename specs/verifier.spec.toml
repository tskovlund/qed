#:schema ../docs/spec.schema.json

# Verifier — verification dispatch, shell execution safety, and
# pure function correctness proofs.
# Owns Qed/Verifier.lean and Qed/Proofs/VerifierProperties.lean.

name = "verifier-correctness"

# --- Proof criteria ---

[[criteria]]
description = "targetToModule correctly extracts the module prefix from a qualified name"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.VerifierProperties.targetToModule_soundness"

[[criteria]]
description = "isValidModuleName guarantees only safe characters for shell interpolation"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.VerifierProperties.isValidModuleName_safe_chars"

[[criteria]]
description = "containsSorry detects all standalone sorry occurrences (no false negatives)"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.VerifierProperties.containsSorry_soundness"

[[criteria]]
description = "containsSorry ignores sorry inside identifiers (no false positives)"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.VerifierProperties.containsSorry_no_false_positive_for_identifiers"

# --- Agent review ---

[[criteria]]
description = "Verifier handles all verification types and shell execution safely"


[criteria.verify]
type = "agent"
prompt = """
Review Qed/Verifier.lean. Verify:

1. Every VerifyType constructor is handled in verifyCriterion (exhaustive match)
2. Shell execution uses platform detection (Unix vs Windows)
3. Output truncation uses the named constant `maxOutputLength` and preserves
   the LAST N chars (most recent output is most useful for debugging)
4. Exit code 0 maps to pass, non-zero maps to fail — no edge cases missed
5. Unimplemented verification types return .skipped, not .fail or .pass
6. Human verification returns .needsHuman, not .skipped

Report any safety concerns, missing edge cases, or incorrect result mappings.
"""
