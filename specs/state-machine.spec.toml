#:schema ../docs/spec.schema.json

name = "state-machine-correctness"

# --- Proof criteria ---
# Top-level guarantees about the worker loop state machine.
# Building-block lemmas (fuel measures, stuck detection directions, specific
# transition paths) live in the proof files but are not spec criteria — they
# exist to support these results, not as independent guarantees.

# Safety: bad things don't happen

[[criteria]]
description = "The ready state always advances — transitions to workerRunning(1) or integrityViolation"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Invariants.ready_always_advances"

[[criteria]]
description = "Terminal states are absorbing — transitioning from a terminal state always returns the same state unchanged"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.FinalStates.terminal_absorbing"

[[criteria]]
description = "Worker must pass through verification before reaching any terminal success state"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.NoSkip.no_skip_verification"

[[criteria]]
description = "Iteration count never exceeds maxIterations — the configured bound is respected"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Invariants.iteration_bounded"

# Invariants: structural properties preserved across all transitions

[[criteria]]
description = "Every non-terminal transition either terminates, self-loops, or follows one of three advance patterns (ready→working, working→verifying, verifying→next iteration)"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Invariants.lifecycle_ordering"

[[criteria]]
description = "Iteration count never decreases across transitions"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Monotonic.iteration_monotonic"

[[criteria]]
description = "State lifecycle phase (initial → working → terminal) never decreases"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Invariants.phase_monotonic"

# Liveness: good things eventually happen

[[criteria]]
description = "The loop always reaches a terminal state within maxIterations transitions"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Termination.loop_terminates"

[[criteria]]
description = "Every state-changing non-terminal transition either terminates or strictly increases the progress measure"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Termination.progress_or_terminal"

# Correctness: the right things happen

[[criteria]]
description = "Stuck detection fires iff the same failures repeat for stuckThreshold consecutive iterations"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.StuckDetection.stuck_iff_threshold"

[[criteria]]
description = "The initial state (ready) is never revisited after leaving it"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Invariants.ready_unreachable"

# Integrity: spec integrity guarantees

[[criteria]]
description = "Integrity violation from any non-terminal state always produces terminal integrityViolation"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.IntegrityEvents.integrity_violation_terminal"

[[criteria]]
description = "Integrity violation from a non-terminal state can never produce passed — violated results are never accepted"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.IntegrityEvents.integrity_violation_not_passed"

# --- Agent review ---

[[criteria]]
description = "Transition function is correct, total, and well-structured"

[criteria.verify]
type = "agent"
prompt = """
Review Qed/StateMachine.lean. Verify:

1. Every LoopState × LoopEvent combination is handled (exhaustive match)
2. The isTerminal guard correctly identifies all and only terminal states
3. Stuck detection logic correctly compares current failures to previous
   and increments/resets the consecutive count
4. The function is pure — no IO, no side effects, no mutable state
5. Retry transitions increment the iteration counter exactly once

Determinism, monotonicity, and phase ordering are formally proven — focus
on structural correctness and edge cases the proofs don't cover.

Report any missed edge cases, logical errors, or unreachable branches.
"""
