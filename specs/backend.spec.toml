#:schema ../docs/spec.schema.json

name = "backend-abstraction"

[worker]
command = "echo 'Implement Backend typeclass in Qed/Backend/'"
workdir = "."

[[criteria]]
description = "Backend typeclass and FileSystem instance compile"

[criteria.verify]
type = "command"
run = "lake build Qed.Backend.FileSystem"

[[criteria]]
description = """
Backend typeclass is properly abstract — no filesystem, HTTP, or \
serialization assumptions leak into the interface. Adding a new backend \
(Linear, Jira, database) requires only implementing the typeclass."""

[criteria.verify]
type = "agentReview"
prompt = """
Review Qed/Backend/Backend.lean and Qed/Backend/FileSystem.lean. Verify:

1. The Backend typeclass methods (fetchSpec, reportResult, listSpecs) use
   only abstract types (SpecId, Spec, LoopState) — no filesystem paths,
   HTTP types, or format-specific types in the interface
2. The FileSystem implementation correctly satisfies all typeclass methods
3. A developer could add a new backend (e.g., Linear API, Jira, SQLite)
   by implementing the typeclass alone — no changes to StateMachine,
   Types, or any other core module
4. Error handling uses Except consistently

Report any abstraction leaks or unnecessary coupling.
"""

[[criteria]]
description = "A new backend can be added by implementing the typeclass alone"

[criteria.verify]
type = "command"
run = "lake build Tests.MockBackend"
