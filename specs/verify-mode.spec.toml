#:schema ../docs/spec.schema.json

# Verify mode — the simpler of qed's two execution modes.
# This spec verifies that verify mode is correctly modeled at the type
# level, enforced by the schema, and documented accurately.

name = "verify-mode"

[[criteria]]
description = "SpecMode has exactly two constructors: workerLoop and verify"

[criteria.verify]
type = "command"
run = "grep -c '| workerLoop\\|| verify' Qed/Types.lean | grep -q '^2$'"

[[criteria]]
description = "JSON Schema enforces at least one criterion when no worker is present"

[criteria.verify]
type = "command"
run = "grep -q 'minItems' docs/spec.schema.json"

[[criteria]]
description = "Verify mode is documented as a separate execution path in architecture.md"

[criteria.verify]
type = "command"
run = "grep -q 'SpecMode.verify' docs/architecture.md"

[[criteria]]
description = """
Verify mode design is correct and complete — single-pass verification \
with no worker, no loop, no state machine dependency."""

[criteria.verify]
type = "agentReview"
prompt = """
Review the verify mode design across these files:

1. Qed/Types.lean — SpecMode.verify constructor, Spec uses SpecMode
2. DocGen/Schema.lean — worker is optional, conditional validation
   enforces ≥1 criteria when no worker
3. docs/architecture.md — verify mode documented as separate path

Verify that:
- The two modes are explicit at the type level (sum type, not Option)
- LoopConfig only exists inside workerLoop (cannot leak to verify mode)
- The verify mode path does not depend on StateMachine.lean
- Documentation accurately describes both modes

Report any inconsistencies.
"""
