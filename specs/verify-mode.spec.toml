#:schema ../docs/spec.schema.json

# Verify mode — no worker, single-pass verification.
# This spec verifies itself: it runs in verify mode and checks that
# verify mode is correctly modeled in the type system and schema.

name = "verify-mode"

[[criteria]]
description = "SpecMode.verify exists as a constructor (the type system models verify mode)"

[criteria.verify]
type = "command"
run = "grep -q '| verify' Qed/Types.lean"

[[criteria]]
description = "SpecMode has exactly two constructors: workerLoop and verify"

[criteria.verify]
type = "command"
run = "grep -c '| workerLoop\\|| verify' Qed/Types.lean | grep -q '^2$'"

[[criteria]]
description = "JSON Schema enforces at least one criterion when no worker is present"

[criteria.verify]
type = "command"
run = "grep -q 'minItems' docs/spec.schema.json"

[[criteria]]
description = "Verify mode is documented in architecture.md"

[criteria.verify]
type = "command"
run = "grep -q 'SpecMode.verify' docs/architecture.md"

[[criteria]]
description = """
Verify mode implementation is correct and complete — single-pass \
verification with no worker, no loop, no state machine dependency."""

[criteria.verify]
type = "agentReview"
prompt = """
Review the verify mode design across these files:

1. Qed/Types.lean — SpecMode.verify constructor exists, Spec uses SpecMode
2. DocGen/Schema.lean — JSON Schema makes worker optional, conditional
   validation enforces ≥1 criteria when no worker
3. docs/architecture.md — verify mode is documented as a separate execution
   path from the worker loop

Verify that:
- The type system makes the two modes explicit (not implicit via Option)
- LoopConfig (maxIterations, stuckThreshold) cannot exist without a worker
- The verify mode path does not depend on StateMachine.lean at all
- Documentation accurately describes both modes

Report any inconsistencies or missing pieces.
"""
