#:schema ../docs/spec.schema.json

# Parser correctness — the bridge between spec files and the typed Spec type.
# If the parser misparses, the wrong thing gets verified.
#
# Build and test coverage is owned by build.spec.json.
# This spec adds formal proofs and design review.

name = "parser-correctness"

# --- Proof criteria ---

[[criteria]]
description = "CI schedule parser accepts exactly the three valid strings"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.ParserProperties.parseCiSchedule_complete"

[[criteria]]
description = "CI schedule parser rejects all invalid strings"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.ParserProperties.parseCiSchedule_rejects_invalid"

[[criteria]]
description = "Serializer→parser roundtrip: parsing serialized JSON recovers the original spec exactly"

[criteria.verify]
type = "proof"
prover = "lean4"
target = "Qed.Proofs.Roundtrip.spec_roundtrip"

# --- Agent review ---

[[criteria]]
description = """
JSON parser faithfully maps JSON to the Spec type — no data loss, no \
silent defaults where explicit values should be required, no ambiguous \
error messages."""

[criteria.verify]
type = "agent"
prompt = """
Review Qed/Parser.lean. Verify:

1. Every field in the Spec type is parsed (nothing silently dropped)
2. Required vs optional fields match the JSON Schema (docs/spec.schema.json)
3. Default values match the type definitions in Qed/Types.lean
4. Error messages identify the exact field and expected type
5. The parser handles both execution modes correctly:
   - worker present → SpecMode.workerLoop with LoopConfig
   - worker absent → SpecMode.verify with ≥1 criteria validation

Report any parsing bugs, missing validation, or data loss risks.
"""

[[criteria]]
description = """
TOML parser correctly handles all value types and structural features \
used in qed specs — arrays of tables with sub-tables, multi-line \
strings, non-ASCII content, and duplicate key rejection."""

[criteria.verify]
type = "agent"
prompt = """
Review Qed/TomlParser.lean. Verify:

1. Byte-based indexing is correct throughout (utf8ByteSize for bounds,
   c.utf8Size for multi-byte character advancement)
2. Array-of-tables with sub-table context ([criteria.verify] after
   [[criteria]]) routes key-values into the last array entry
3. Multi-line string parsing handles first-newline trimming, escape
   sequences, and line-ending backslash continuation
4. Duplicate key detection catches redefinitions at all nesting levels
5. The Ctx state machine correctly tracks root, table, and array context
6. Edge cases: empty document, comments, bare vs quoted keys, dotted keys

Report any parse errors, data corruption risks, or TOML spec violations.
"""
